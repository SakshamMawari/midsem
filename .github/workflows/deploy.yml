name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-check:
    name: Quality Checks & Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Manifest Freshness
        run: npm run test:manifest

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Verify Next.js Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: quality-check
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate Vercel Secrets
        run: |
          missing_secrets=()
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            missing_secrets+=("VERCEL_TOKEN")
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            missing_secrets+=("VERCEL_ORG_ID")
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            missing_secrets+=("VERCEL_PROJECT_ID")
          fi

          if [ ${#missing_secrets[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub repository secrets: ${missing_secrets[*]}"
            echo "Please configure these secrets in your GitHub repository:"
            echo "Repository -> Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Required keys:"
            echo "  - VERCEL_TOKEN"
            echo "  - VERCEL_ORG_ID"
            echo "  - VERCEL_PROJECT_ID"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ---------------------------------------------------------
      # Production Deployment (Pushes and manual dispatch to main)
      # ---------------------------------------------------------
      - name: Pull Vercel Environment (Production)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Production)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "### 🚀 Vercel Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Successfully built and deployed commit \`${{ github.sha }}\` to production." >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Live" >> $GITHUB_STEP_SUMMARY
          echo "- **Production URL:** $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY

      # ---------------------------------------------------------
      # Preview Deployment (Pull Requests)
      # ---------------------------------------------------------
      - name: Pull Vercel Environment (Preview)
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Preview)
        if: github.event_name == 'pull_request'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV
          echo "### 🔍 Vercel Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Successfully built and deployed preview for PR #${{ github.event.pull_request.number }}." >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Ready" >> $GITHUB_STEP_SUMMARY
          echo "- **Preview URL:** $PREVIEW_URL" >> $GITHUB_STEP_SUMMARY
